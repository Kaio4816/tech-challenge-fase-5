apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.1.0
    helm:
      releaseName: loki
      valuesObject:
        # SingleBinary (não SimpleScalable/distributed) — custo mínimo,
        # 1 réplica, storage em filesystem (PVC), sem MinIO/gateway/cache.
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: filesystem
          limits_config:
            retention_period: 48h
        singleBinary:
          replicas: 1
          persistence:
            # Ver a nota em kube-prometheus-stack-app.yaml: o EKS não marca
            # nenhuma StorageClass como default, então o PVC precisa nomear a
            # `gp2` explicitamente ou fica Pending indefinidamente.
            storageClass: gp2
            size: 10Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
        # SimpleScalable/distributed desligado (só usamos singleBinary).
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        minio:
          enabled: false
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        monitoring:
          serviceMonitor:
            enabled: true
          selfMonitoring:
            enabled: false
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
