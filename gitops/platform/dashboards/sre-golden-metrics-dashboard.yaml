apiVersion: v1
kind: ConfigMap
metadata:
  name: solidarytech-sre-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sre-golden-metrics.json: |
    {
      "id": null,
      "uid": "solidarytech-sre",
      "title": "SolidaryTech - SRE Golden Metrics & SLO (donation-service)",
      "tags": ["solidarytech", "sre", "slo"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Golden Metrics - donation-service (Hot Path)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Traffic - requisicoes/s por status (POST /donations)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total{job=\"donation-service\",path=\"/donations\"}[5m])) by (status)",
              "legendFormat": "status {{status}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Errors - % de respostas 5xx (5m)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "donation_service:errors:ratio_rate5m",
              "legendFormat": "error ratio 5m"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Latency - p50/p95/p99 (POST /donations)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"donation-service\",path=\"/donations\"}[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"donation-service\",path=\"/donations\"}[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"donation-service\",path=\"/donations\"}[5m])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Saturation - CPU por pod (namespace solidarytech)",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"solidarytech\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Saturation - Memoria por pod (namespace solidarytech)",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"solidarytech\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "row",
          "title": "SLO / Error Budget - donation-service (janela: dados disponiveis, retention 2d)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 }
        },
        {
          "id": 8,
          "type": "gauge",
          "title": "Disponibilidade (nao-5xx) - acumulada no periodo com dados",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 99,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 99.5 },
                  { "color": "green", "value": 99.9 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(1 - (sum(increase(http_requests_total{job=\"donation-service\",path=\"/donations\",status=~\"5..\"}[30d])) / sum(increase(http_requests_total{job=\"donation-service\",path=\"/donations\"}[30d])))) * 100",
              "legendFormat": "disponibilidade"
            }
          ]
        },
        {
          "id": 9,
          "type": "gauge",
          "title": "Error budget restante (SLO 99.9%/30d)",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 20 },
                  { "color": "green", "value": 50 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "clamp_min(1 - ((sum(increase(http_requests_total{job=\"donation-service\",path=\"/donations\",status=~\"5..\"}[30d])) / sum(increase(http_requests_total{job=\"donation-service\",path=\"/donations\"}[30d]))) / 0.001), 0) * 100",
              "legendFormat": "budget restante"
            }
          ]
        },
        {
          "id": 10,
          "type": "gauge",
          "title": "Burn rate atual (janela 1h, multiplo do sustentavel)",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 20,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 6 },
                  { "color": "red", "value": 14.4 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "donation_service:errors:ratio_rate1h / 0.001",
              "legendFormat": "burn rate 1h"
            }
          ]
        }
      ]
    }
