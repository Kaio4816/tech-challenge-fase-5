# Template do app-of-apps. __REPO_URL__ e __ENV__ são substituídos pelo
# install.sh na hora do apply — não aplicar este arquivo diretamente.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: solidarytech-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: main
    path: gitops/apps/overlays/__ENV__
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
