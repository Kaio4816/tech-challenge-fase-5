apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: solidarytech
resources:
- ../../../base/ngo-service
  # Tag "latest" até o CI (Fase 2) rodar de verdade e o job "gitops" trocar
  # para a tag = SHA do commit. Sem a imagem publicada, o pod fica em
  # ImagePullBackOff (esperado, não é bug do manifesto).
images:
- name: ngo-service
  newName: 712819938659.dkr.ecr.us-east-1.amazonaws.com/solidarytech/ngo-service
  newTag: 3170bcde7f11b13bdb21115ecd83c06ee107b149
