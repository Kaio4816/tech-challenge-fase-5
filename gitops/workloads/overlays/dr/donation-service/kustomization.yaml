apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: solidarytech
resources:
  - ../../../base/donation-service
images:
  - name: donation-service
    newName: 712819938659.dkr.ecr.us-east-2.amazonaws.com/solidarytech/donation-service
    newTag: latest
patches:
  # A role IRSA do DR tem name_prefix diferente (solidarytech-dr-*) — ver
  # infra/terraform/envs/dr/main.tf (module.irsa).
  - target:
      kind: ServiceAccount
      name: donation-service
    patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::712819938659:role/solidarytech-dr-donation-service
