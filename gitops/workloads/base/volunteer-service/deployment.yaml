apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-service
  labels:
    app.kubernetes.io/name: volunteer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: volunteer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: volunteer-service
    spec:
      serviceAccountName: volunteer-service
      containers:
        - name: volunteer-service
          image: volunteer-service
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: PORT
              value: "8083"
          envFrom:
            - secretRef:
                name: volunteer-service-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
