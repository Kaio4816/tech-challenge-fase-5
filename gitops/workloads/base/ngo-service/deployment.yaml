apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngo-service
  labels:
    app.kubernetes.io/name: ngo-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ngo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ngo-service
    spec:
      serviceAccountName: ngo-service
      containers:
        - name: ngo-service
          image: ngo-service
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
          envFrom:
            - secretRef:
                name: ngo-service-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
