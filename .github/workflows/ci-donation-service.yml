name: CI - donation-service

on:
  push:
    branches: [main]
    paths:
      - "apps/donation-service/**"
      - ".github/workflows/ci-donation-service.yml"
  pull_request:
    paths:
      - "apps/donation-service/**"
      - ".github/workflows/ci-donation-service.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/donation-service

env:
  SERVICE_NAME: donation-service
  ECR_REPOSITORY: solidarytech/donation-service
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/donation-service/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test (com coverage)
        run: go test ./... -coverprofile=coverage.out

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ env.SERVICE_NAME }}
          path: apps/donation-service/coverage.out
          retention-days: 7

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semgrep scan
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --error .

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    # SonarCloud é uma dependência externa pendente (ver CLAUDE.md); o job só
    # roda quando a organização e o token já estiverem configurados nas
    # variáveis/segredos do repositório GitHub.
    if: ${{ vars.SONAR_ORGANIZATION != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-${{ env.SERVICE_NAME }}
          path: apps/donation-service
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          projectBaseDir: apps/donation-service
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_ORGANIZATION }}_donation-service
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out

  sca:
    name: SCA (govulncheck + trivy fs)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/donation-service/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/donation-service
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  build:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: [sast, sonar, sca]
    # O job "sonar" fica "skipped" (não "success") quando o SonarCloud ainda
    # não está configurado — por padrão o GitHub Actions propaga esse skip
    # para quem depende dele. Sem este "if", o pipeline inteiro (build,
    # scan-image, push, gitops) nunca rodaria até o SonarCloud existir.
    if: |
      always() &&
      needs.sast.result == 'success' &&
      needs.sca.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} .
      - name: Salvar imagem como artefato
        run: docker save ${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} -o /tmp/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ env.SERVICE_NAME }}
          path: /tmp/image.tar
          retention-days: 1

  scan-image:
    name: Trivy (imagem)
    runs-on: ubuntu-latest
    needs: build
    # Sem função de status (always/success/...) no "if", o GitHub Actions
    # aplica um "&& success()" implícito que olha a árvore INTEIRA de
    # dependências (não só o "needs" direto) — como "sonar" fica skipped
    # em algum ponto da árvore, isso derrubava este job mesmo com build OK.
    if: always() && needs.build.result == 'success'
    # Este job não faz checkout (só baixa o artefato da imagem), então
    # apps/<serviço> (o working-directory padrão do workflow) nem existe
    # no runner — sem isso os passos "run:" abaixo falham de cara.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ env.SERVICE_NAME }}
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  push:
    name: Push para ECR
    runs-on: ubuntu-latest
    needs: scan-image
    # O ECR e a role OIDC só existem a partir da Fase 3 (Terraform). Até lá
    # este job fica condicionado e não quebra o pipeline. always() evita o
    # "&& success()" implícito, que olharia a árvore inteira (inclui o
    # skip do sonar) em vez de só o "needs" direto.
    if: always() && needs.scan-image.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_ECR_ROLE_ARN != ''
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    # Mesmo motivo do scan-image: este job não faz checkout.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ env.SERVICE_NAME }}
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - name: Tag e push
        id: image
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          docker tag ${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} "$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker tag ${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} "$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          echo "image=$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  gitops:
    name: Atualizar imagem no GitOps
    runs-on: ubuntu-latest
    needs: push
    # O overlay do ArgoCD só existe a partir da Fase 4; até lá este job não
    # tem o que fazer porque o job "push" acima também fica condicionado.
    # always() evita o "&& success()" implícito (ver comentário no job push).
    if: always() && needs.push.result == 'success'
    permissions:
      contents: write
    # Reseta o working-directory padrão do workflow (apps/<serviço>) — este
    # job mexe em gitops/, não em apps/, e precisa rodar a partir da raiz
    # do repo (senão "git add gitops/..." resolve para um caminho errado).
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Instalar kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Atualizar tag da imagem (overlay primary)
        working-directory: gitops/workloads/overlays/primary/donation-service
        run: kustomize edit set image ${{ env.SERVICE_NAME }}=${{ needs.push.outputs.image }}
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/workloads/overlays/primary/donation-service/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore(gitops): bump ${{ env.SERVICE_NAME }} para ${{ env.IMAGE_TAG }} [skip ci]"
          git push
